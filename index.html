<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tacos el Muñeco · Punto de venta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --papel:#FAFAF3;
    --tinta:#26211C;
    --chile:#B3261E;
    --chile-osc:#8E1C16;
    --salsa:#2F6B3A;
    --maiz:#F2B632;
    --linea:#DAD6C8;
    --suave:#EFEDE0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--papel);color:var(--tinta);
    font-size:16px;line-height:1.4;
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--maiz);outline-offset:2px}

  /* Login */
  #login{max-width:360px;margin:12vh auto 0;padding:0 20px}
  #login h1{font-size:2.2rem;font-weight:800;margin:0 0 4px;color:var(--chile)}
  #login p{margin:0 0 20px}
  .campo{display:block;margin-bottom:12px}
  .campo span{display:block;font-weight:600;margin-bottom:4px}
  .campo input{width:100%;padding:12px;border:2px solid var(--linea);border-radius:8px;background:#fff}
  .campo input:focus{border-color:var(--salsa);outline:none}
  .error{color:var(--chile-osc);font-weight:600;min-height:1.4em;margin-top:8px}

  .btn{border:0;border-radius:8px;padding:12px 16px;font-weight:700;background:var(--tinta);color:#fff}
  .btn.grande{width:100%;padding:16px;font-size:1.15rem}
  .btn.cobrar{background:var(--salsa)}
  .btn.cobrar:hover:not(:disabled){background:#245530}
  .btn.sec{background:transparent;color:var(--tinta);border:2px solid var(--linea)}
  .btn.sec:hover{border-color:var(--tinta)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* App */
  #app{display:none}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 20px;background:var(--chile);color:#fff}
  header h1{margin:0;font-size:1.4rem;font-weight:800}
  #hora{font-weight:600}
  header .btn{background:rgba(255,255,255,.18);padding:8px 12px}
  header .btn:hover{background:rgba(255,255,255,.3)}
  .derecha{display:flex;align-items:center;gap:14px}

  main{display:grid;grid-template-columns:1fr 380px;gap:24px;padding:20px;max-width:1200px;margin:0 auto}
  h2{font-size:1.1rem;margin:22px 0 8px;font-weight:800;color:var(--salsa)}
  h2:first-child{margin-top:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .prod{position:relative;text-align:left;background:#fff;border:2px solid var(--linea);border-radius:10px;
    padding:12px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
  .prod:hover{border-color:var(--maiz)}
  .prod:active{background:var(--suave)}
  .prod .nombre{font-weight:600}
  .prod .precio{font-weight:800;color:var(--chile)}
  .prod .cant{position:absolute;top:-8px;right:-8px;background:var(--maiz);color:var(--tinta);
    font-weight:800;border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0 6px}

  /* Ticket */
  aside{background:#fff;border:2px solid var(--linea);border-radius:12px;padding:16px;align-self:start;position:sticky;top:12px}
  aside h2{margin-top:0}
  #lineas{min-height:60px;margin-bottom:8px}
  .vacio{color:#6d665c}
  .linea{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--suave)}
  .linea .sub{font-weight:700;text-align:right}
  .ctrl{display:flex;align-items:center;gap:8px}
  .ctrl button{width:34px;height:34px;border-radius:8px;border:2px solid var(--linea);background:#fff;font-weight:800}
  .ctrl button:hover{border-color:var(--tinta)}
  .total{display:flex;justify-content:space-between;align-items:baseline;font-size:1.5rem;font-weight:800;padding:12px 0}

  fieldset{border:0;padding:0;margin:0 0 12px;display:flex;gap:8px}
  fieldset legend{font-weight:600;margin-bottom:6px;padding:0}
  .metodo{flex:1;position:relative}
  .metodo input{position:absolute;opacity:0}
  .metodo label{display:block;text-align:center;padding:12px;border:2px solid var(--linea);border-radius:8px;font-weight:700;cursor:pointer}
  .metodo input:checked + label{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  .metodo input:focus-visible + label{outline:3px solid var(--maiz);outline-offset:2px}

  #bloqueEfectivo{background:var(--suave);border-radius:8px;padding:12px;margin-bottom:12px}
  .exacto{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:10px}
  .exacto input{width:20px;height:20px}
  .billetes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .billetes button{padding:8px 12px;border:2px solid var(--linea);background:#fff;border-radius:8px;font-weight:700}
  .billetes button:hover{border-color:var(--tinta)}
  #recibido{width:100%;padding:10px;border:2px solid var(--linea);border-radius:8px;background:#fff}
  #recibido:disabled{background:var(--suave)}
  .cambio{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:800;margin-top:10px}
  .cambio.falta{color:var(--chile-osc)}
  .cambio.ok{color:var(--salsa)}

  #msg{margin-top:10px;font-weight:600;min-height:1.4em}
  #msg.ok{color:var(--salsa)}
  #msg.mal{color:var(--chile-osc)}
  .acciones{display:grid;gap:8px;margin-top:8px}

  /* Pestañas y ventas del día */
  .tabs{display:flex;gap:6px}
  .tab{border:0;background:rgba(255,255,255,.15);color:#fff;font-weight:700;padding:8px 14px;border-radius:8px}
  .tab:hover{background:rgba(255,255,255,.28)}
  .tab.activa{background:#fff;color:var(--chile)}
  .campo.fecha{max-width:220px}
  .resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0 18px}
  .dato{background:#fff;border:2px solid var(--linea);border-radius:10px;padding:12px}
  .dato span{display:block;font-weight:600;color:#6d665c}
  .dato strong{font-size:1.5rem;font-weight:800}
  .dato:first-child strong{color:var(--salsa)}
  details.vta{background:#fff;border:2px solid var(--linea);border-radius:10px;margin-bottom:8px}
  details.vta[open]{border-color:var(--tinta)}
  details.vta summary{display:grid;grid-template-columns:70px 1fr 90px 100px;gap:8px;padding:12px;cursor:pointer;list-style:none;font-weight:600}
  details.vta summary::-webkit-details-marker{display:none}
  details.vta summary .t{text-align:right;font-weight:800}
  .vta .cuerpo{padding:0 12px 12px;border-top:1px solid var(--suave)}
  .vta .it{display:flex;justify-content:space-between;padding:6px 0}
  .vta .pie{margin-top:6px;color:#6d665c;font-weight:600}
  .vacio-dia{color:#6d665c;padding:12px 0}
  details.vta.anulada{background:var(--suave);border-style:dashed}
  details.vta.anulada summary{color:#6d665c}
  details.vta.anulada summary .t{text-decoration:line-through}
  .anular{margin-top:12px;display:grid;gap:8px}
  .anular input{width:100%;padding:10px;border:2px solid var(--linea);border-radius:8px;background:#fff}
  .anular .fila-b{display:flex;gap:8px;flex-wrap:wrap}
  .btn.peligro{background:var(--chile)}
  .btn.peligro:hover:not(:disabled){background:var(--chile-osc)}
  .btn.chico{padding:8px 12px}
  .aviso-anul{margin-top:6px;font-weight:600;color:var(--chile-osc)}
  .dia{display:grid;grid-template-columns:1fr auto auto;gap:10px;width:100%;text-align:left;
    padding:10px;border:2px solid var(--linea);border-radius:8px;background:#fff;margin-bottom:6px}
  .dia:hover{border-color:var(--tinta)}
  .dia.sel{border-color:var(--salsa);background:var(--suave)}
  .dia .m{font-weight:800}
  .dia .n{color:#6d665c}

  @media (max-width:860px){
    header{flex-wrap:wrap}
    details.vta summary{grid-template-columns:50px 1fr 80px}
    details.vta summary .m{display:none}
    main{grid-template-columns:1fr;padding:12px}
    aside{position:static}
    #hora{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- Inicio de sesión -->
<section id="login">
  <h1>Tacos el Muñeco</h1>
  <p>Inicia sesión para registrar ventas.</p>
  <label class="campo"><span>Correo</span>
    <input type="email" id="correo" autocomplete="username"></label>
  <label class="campo"><span>Contraseña</span>
    <input type="password" id="clave" autocomplete="current-password"></label>
  <button class="btn grande" id="entrar">Entrar</button>
  <div class="error" id="errorLogin" role="alert"></div>
</section>

<!-- Aplicación -->
<div id="app">
  <header>
    <h1>Tacos el Muñeco</h1>
    <nav class="tabs" aria-label="Secciones">
      <button class="tab activa" id="tabVenta" type="button">Vender</button>
      <button class="tab" id="tabVentas" type="button">Ventas del día</button>
    </nav>
    <div class="derecha">
      <span id="hora"></span>
      <button class="btn" id="salir">Cerrar sesión</button>
    </div>
  </header>

  <main id="vistaVenta">
    <section id="productos" aria-label="Productos"></section>

    <aside aria-label="Venta actual">
      <h2>Venta actual</h2>
      <div id="lineas"></div>
      <div class="total"><span>Total</span><span>$<span id="total">0.00</span></span></div>

      <fieldset>
        <legend>Forma de pago</legend>
        <div class="metodo">
          <input type="radio" name="pago" id="pagoEfectivo" value="efectivo" checked>
          <label for="pagoEfectivo">Efectivo</label>
        </div>
        <div class="metodo">
          <input type="radio" name="pago" id="pagoTarjeta" value="tarjeta">
          <label for="pagoTarjeta">Tarjeta</label>
        </div>
      </fieldset>

      <div id="bloqueEfectivo">
        <label class="exacto"><input type="checkbox" id="exacto"> Pagó exacto</label>
        <label for="recibido" style="font-weight:600">¿Con cuánto pagó?</label>
        <input type="number" id="recibido" min="0" step="0.5" inputmode="decimal" placeholder="0.00">
        <div class="billetes" id="billetes">
          <button type="button" data-v="50">$50</button>
          <button type="button" data-v="100">$100</button>
          <button type="button" data-v="200">$200</button>
          <button type="button" data-v="500">$500</button>
        </div>
        <div class="cambio" id="cambioBox"><span id="cambioEtq">Cambio</span><span>$<span id="cambio">0.00</span></span></div>
      </div>

      <div class="acciones">
        <button class="btn grande cobrar" id="cobrar">Cobrar y guardar</button>
        <button class="btn sec" id="cancelar">Cancelar venta</button>
      </div>
      <div id="msg" role="status"></div>
    </aside>
  </main>

  <main id="vistaVentas" style="display:none">
    <section aria-label="Ventas del día">
      <h2 id="tituloDia"></h2>
      <label class="campo fecha"><span>Día</span>
        <input type="date" id="fechaVentas"></label>
      <div class="resumen">
        <div class="dato"><span>Total del día</span><strong>$<span id="totalDia">0.00</span></strong></div>
        <div class="dato"><span>Ventas</span><strong id="numDia">0</strong></div>
        <div class="dato"><span>Efectivo</span><strong>$<span id="efDia">0.00</span></strong></div>
        <div class="dato"><span>Tarjeta</span><strong>$<span id="taDia">0.00</span></strong></div>
      </div>
      <div id="listaDia"></div>
    </section>
    <aside aria-label="Últimos 30 días">
      <h2>Últimos 30 días</h2>
      <div id="resumenDias"></div>
    </aside>
  </main>
</div>

<script>
const SUPABASE_URL = "https://jnvfoupgknytjndlabmf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpudmZvdXBna255dGpuZGxhYm1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NjQxMDcsImV4cCI6MjEwODQ0MDEwN30.yWoykiFpwQzfJbD4XSb-_Yav6pMTLQzbIXiB5nakyNU";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const redondear = n => Math.round(n * 100) / 100;
const dinero = n => redondear(n).toFixed(2);

let catalogo = [];
let carrito = {};        
let guardando = false;

/* Reloj */
function reloj(){ $("hora").textContent = new Date().toLocaleString("es-MX", { dateStyle: "medium", timeStyle: "medium" }); }
setInterval(reloj, 1000); reloj();

/* Mensajes */
function mensaje(texto, tipo){ const m = $("msg"); m.textContent = texto; m.className = tipo || ""; }

/* Productos */
async function cargarProductos(){
  const { data, error } = await db.from("productos").select("*").eq("activo", true).order("id");
  if (error) { mensaje("No se pudieron cargar los productos: " + error.message, "mal"); return; }
  catalogo = data;
  pintarProductos();
}

function pintarProductos(){
  const cont = $("productos");
  cont.innerHTML = "";
  [...new Set(catalogo.map(p => p.categoria))].forEach(cat => {
    const h = document.createElement("h2"); h.textContent = cat; cont.appendChild(h);
    const grid = document.createElement("div"); grid.className = "grid";
    catalogo.filter(p => p.categoria === cat).forEach(p => {
      const b = document.createElement("button");
      b.className = "prod"; b.type = "button";
      const n = document.createElement("span"); n.className = "nombre"; n.textContent = p.nombre;
      const pr = document.createElement("span"); pr.className = "precio"; pr.textContent = "$" + dinero(p.precio);
      b.append(n, pr);
      const enCarrito = carrito[p.id];
      if (enCarrito) {
        const c = document.createElement("span"); c.className = "cant"; c.textContent = enCarrito.cantidad;
        b.appendChild(c);
      }
      b.onclick = () => agregar(p);
      grid.appendChild(b);
    });
    cont.appendChild(grid);
  });
}

/* Carrito */
function agregar(p){
  carrito[p.id] = carrito[p.id] || { producto: p, cantidad: 0 };
  carrito[p.id].cantidad++;
  actualizar();
}
function cambiarCant(id, d){
  if (!carrito[id]) return;
  carrito[id].cantidad += d;
  if (carrito[id].cantidad <= 0) delete carrito[id];
  actualizar();
}
function total(){
  return redondear(Object.values(carrito).reduce((s, l) => s + l.producto.precio * l.cantidad, 0));
}

function pintarTicket(){
  const cont = $("lineas");
  cont.innerHTML = "";
  const lineas = Object.values(carrito);
  if (!lineas.length) {
    const v = document.createElement("div"); v.className = "vacio";
    v.textContent = "Toca un producto para agregarlo.";
    cont.appendChild(v);
  }
  lineas.forEach(l => {
    const fila = document.createElement("div"); fila.className = "linea";
    const nom = document.createElement("div"); nom.textContent = l.producto.nombre;
    const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = "$" + dinero(l.producto.precio * l.cantidad);
    const ctrl = document.createElement("div"); ctrl.className = "ctrl";
    const menos = document.createElement("button"); menos.type = "button"; menos.textContent = "−"; menos.setAttribute("aria-label", "Quitar uno");
    const num = document.createElement("span"); num.textContent = l.cantidad;
    const mas = document.createElement("button"); mas.type = "button"; mas.textContent = "+"; mas.setAttribute("aria-label", "Agregar uno");
    menos.onclick = () => cambiarCant(l.producto.id, -1);
    mas.onclick = () => cambiarCant(l.producto.id, 1);
    ctrl.append(menos, num, mas);
    fila.append(nom, sub, ctrl);
    cont.appendChild(fila);
  });
  $("total").textContent = dinero(total());
}

/* Pago */
function metodo(){ return document.querySelector("input[name=pago]:checked").value; }

function actualizarPago(){
  const esEfectivo = metodo() === "efectivo";
  $("bloqueEfectivo").style.display = esEfectivo ? "block" : "none";
  if (!esEfectivo) return;

  const t = total();
  if ($("exacto").checked) $("recibido").value = t ? dinero(t) : "";
  $("recibido").disabled = $("exacto").checked;
  $("billetes").style.display = $("exacto").checked ? "none" : "flex";

  const rec = Number($("recibido").value) || 0;
  const box = $("cambioBox");
  if (t > 0 && rec < t) {
    $("cambioEtq").textContent = "Faltan";
    $("cambio").textContent = dinero(t - rec);
    box.className = "cambio falta";
  } else {
    $("cambioEtq").textContent = "Cambio";
    $("cambio").textContent = dinero(rec - t);
    box.className = "cambio" + (t > 0 ? " ok" : "");
  }
}

function actualizar(){ pintarProductos(); pintarTicket(); actualizarPago(); }

document.querySelectorAll("input[name=pago]").forEach(r => r.onchange = actualizarPago);
$("exacto").onchange = actualizarPago;
$("recibido").oninput = actualizarPago;
$("billetes").onclick = e => {
  const v = e.target.dataset.v;
  if (!v) return;
  $("exacto").checked = false;
  $("recibido").value = v;
  actualizarPago();
};

function limpiarVenta(){
  carrito = {};
  $("exacto").checked = false;
  $("recibido").value = "";
  $("pagoEfectivo").checked = true;
  actualizar();
}
$("cancelar").onclick = () => { limpiarVenta(); mensaje(""); };

/* Cobrar */
$("cobrar").onclick = async () => {
  if (guardando) return;
  const t = total();
  if (t <= 0) { mensaje("Agrega al menos un producto.", "mal"); return; }

  const venta = { total: t, metodo_pago: metodo() };
  if (venta.metodo_pago === "efectivo") {
    const rec = redondear(Number($("recibido").value) || 0);
    if (rec < t) { mensaje("El monto recibido es menor al total.", "mal"); return; }
    venta.efectivo_exacto = $("exacto").checked || rec === t;
    venta.monto_recibido = rec;
    venta.cambio = redondear(rec - t);
  }

  guardando = true; $("cobrar").disabled = true; mensaje("Guardando…");

  const { data, error } = await db.from("ventas").insert(venta).select().single();
  if (error) { fin("No se pudo guardar la venta: " + error.message, "mal"); return; }

  const detalle = Object.values(carrito).map(l => ({
    venta_id: data.id,
    producto_id: l.producto.id,
    cantidad: l.cantidad,
    precio_unitario: l.producto.precio,
    subtotal: redondear(l.producto.precio * l.cantidad)
  }));
  const { error: e2 } = await db.from("detalle_venta").insert(detalle);
  if (e2) { fin("Se guardó la venta #" + data.id + " pero falló el detalle: " + e2.message, "mal"); return; }

  const hora = new Date(data.fecha_hora).toLocaleString("es-MX", { dateStyle: "medium", timeStyle: "medium" });
  let texto = "Venta #" + data.id + " guardada · " + hora;
  if (venta.metodo_pago === "efectivo" && venta.cambio > 0) texto += " · Entrega $" + dinero(venta.cambio) + " de cambio";
  limpiarVenta();
  fin(texto, "ok");

  function fin(t, tipo){ guardando = false; $("cobrar").disabled = false; mensaje(t, tipo); }
};

/* ====== Ventas por día ====== */
const dosD = n => String(n).padStart(2, "0");
const fechaLocal = d => d.getFullYear() + "-" + dosD(d.getMonth() + 1) + "-" + dosD(d.getDate());
const horaCorta = iso => new Date(iso).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const partes = f => f.split("-").map(Number);
const fechaLarga = f => { const [y, m, d] = partes(f); return new Date(y, m - 1, d).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); };
const sumar = arr => redondear(arr.reduce((s, v) => s + Number(v.total), 0));
const nombreMetodo = m => m === "efectivo" ? "Efectivo" : "Tarjeta";

function mostrarVista(v){
  const esVenta = v === "venta";
  $("vistaVenta").style.display = esVenta ? "grid" : "none";
  $("vistaVentas").style.display = esVenta ? "none" : "grid";
  $("tabVenta").classList.toggle("activa", esVenta);
  $("tabVentas").classList.toggle("activa", !esVenta);
  if (!esVenta) {
    if (!$("fechaVentas").value) $("fechaVentas").value = fechaLocal(new Date());
    cargarDia(); cargarResumen();
  }
}
$("tabVenta").onclick = () => mostrarVista("venta");
$("tabVentas").onclick = () => mostrarVista("ventas");
$("fechaVentas").onchange = () => { cargarDia(); marcarDia(); };

async function cargarDia(){
  const f = $("fechaVentas").value;
  if (!f) return;
  const [y, m, d] = partes(f);
  const ini = new Date(y, m - 1, d), fin = new Date(y, m - 1, d + 1);
  $("tituloDia").textContent = fechaLarga(f);

  const { data, error } = await db.from("ventas").select("*")
    .gte("fecha_hora", ini.toISOString()).lt("fecha_hora", fin.toISOString())
    .order("fecha_hora", { ascending: false });
  const lista = $("listaDia"); lista.innerHTML = "";
  if (error) { lista.textContent = "No se pudieron cargar las ventas: " + error.message; return; }

  const activas = data.filter(v => v.estado !== "anulada");
  const nAnul = data.length - activas.length;
  $("totalDia").textContent = dinero(sumar(activas));
  $("numDia").textContent = activas.length + (nAnul ? " (" + nAnul + (nAnul === 1 ? " anulada)" : " anuladas)") : "");
  $("efDia").textContent = dinero(sumar(activas.filter(v => v.metodo_pago === "efectivo")));
  $("taDia").textContent = dinero(sumar(activas.filter(v => v.metodo_pago === "tarjeta")));

  if (!data.length) {
    const v = document.createElement("div"); v.className = "vacio-dia";
    v.textContent = "No hay ventas registradas este día.";
    lista.appendChild(v); return;
  }
  data.forEach(v => lista.appendChild(filaVenta(v)));
}

function filaVenta(v){
  const det = document.createElement("details"); det.className = "vta";
  if (v.estado === "anulada") det.classList.add("anulada");
  const sm = document.createElement("summary");
  [["#" + v.id, ""], [horaCorta(v.fecha_hora), ""], [nombreMetodo(v.metodo_pago) + (v.estado === "anulada" ? " · Anulada" : ""), "m"], ["$" + dinero(v.total), "t"]].forEach(([txt, cls]) => {
    const s = document.createElement("span"); if (cls) s.className = cls; s.textContent = txt; sm.appendChild(s);
  });
  const cuerpo = document.createElement("div"); cuerpo.className = "cuerpo";
  det.append(sm, cuerpo);

  let cargado = false;
  det.addEventListener("toggle", async () => {
    if (!det.open || cargado) return;
    cargado = true; cuerpo.textContent = "Cargando…";
    const { data, error } = await db.from("detalle_venta")
      .select("cantidad,subtotal,productos(nombre)").eq("venta_id", v.id).order("id");
    cuerpo.textContent = "";
    if (error) { cuerpo.textContent = "No se pudo cargar el detalle: " + error.message; cargado = false; return; }
    data.forEach(it => {
      const fila = document.createElement("div"); fila.className = "it";
      const a = document.createElement("span"); a.textContent = it.cantidad + " × " + (it.productos ? it.productos.nombre : "Producto");
      const b = document.createElement("span"); b.textContent = "$" + dinero(it.subtotal);
      fila.append(a, b); cuerpo.appendChild(fila);
    });
    const pie = document.createElement("div"); pie.className = "pie";
    if (v.metodo_pago === "efectivo") {
      pie.textContent = v.efectivo_exacto ? "Efectivo · pago exacto"
        : "Efectivo · recibido $" + dinero(v.monto_recibido) + " · cambio $" + dinero(v.cambio);
    } else pie.textContent = "Tarjeta";
    cuerpo.appendChild(pie);

    if (v.estado === "anulada") {
      const av = document.createElement("div"); av.className = "aviso-anul";
      const cuando = v.anulada_en ? new Date(v.anulada_en).toLocaleString("es-MX", { dateStyle: "medium", timeStyle: "short" }) : "";
      av.textContent = "Venta anulada" + (cuando ? " · " + cuando : "") + (v.motivo_anulacion ? " · Motivo: " + v.motivo_anulacion : "");
      cuerpo.appendChild(av);
    } else {
      cuerpo.appendChild(controlesAnular(v));
    }
  });
  return det;
}

function controlesAnular(v){
  const caja = document.createElement("div"); caja.className = "anular";
  const abrir = document.createElement("button");
  abrir.type = "button"; abrir.className = "btn sec chico"; abrir.textContent = "Anular venta";
  abrir.style.justifySelf = "start";

  const form = document.createElement("div"); form.className = "anular"; form.style.display = "none";
  const motivo = document.createElement("input");
  motivo.type = "text"; motivo.maxLength = 120; motivo.placeholder = "Motivo (por ejemplo: producto equivocado)";
  motivo.setAttribute("aria-label", "Motivo de la anulación");
  const fila = document.createElement("div"); fila.className = "fila-b";
  const ok = document.createElement("button"); ok.type = "button"; ok.className = "btn peligro chico"; ok.textContent = "Confirmar anulación";
  const no = document.createElement("button"); no.type = "button"; no.className = "btn sec chico"; no.textContent = "Cancelar";
  const msg = document.createElement("div"); msg.className = "aviso-anul";
  fila.append(ok, no); form.append(motivo, fila, msg);

  abrir.onclick = () => { abrir.style.display = "none"; form.style.display = "grid"; motivo.focus(); };
  no.onclick = () => { form.style.display = "none"; abrir.style.display = ""; msg.textContent = ""; motivo.value = ""; };
  ok.onclick = async () => {
    const m = motivo.value.trim();
    if (!m) { msg.textContent = "Escribe el motivo de la anulación."; return; }
    ok.disabled = true; msg.textContent = "Anulando…";
    const { data, error } = await db.from("ventas")
      .update({ estado: "anulada", anulada_en: new Date().toISOString(), motivo_anulacion: m })
      .eq("id", v.id).eq("estado", "activa").select();
    if (error || !data || !data.length) {
      ok.disabled = false;
      msg.textContent = "No se pudo anular: " + (error ? error.message : "revisa los permisos en Supabase.");
      return;
    }
    cargarDia(); cargarResumen();
  };
  caja.append(abrir, form);
  return caja;
}

async function cargarResumen(){
  const ini = new Date(); ini.setHours(0, 0, 0, 0); ini.setDate(ini.getDate() - 29);
  const { data, error } = await db.from("ventas").select("fecha_hora,total").eq("estado", "activa")
    .gte("fecha_hora", ini.toISOString()).order("fecha_hora", { ascending: false });
  const cont = $("resumenDias"); cont.innerHTML = "";
  if (error) { cont.textContent = "No se pudo cargar el resumen: " + error.message; return; }
  if (!data.length) { const v = document.createElement("div"); v.className = "vacio-dia"; v.textContent = "Aún no hay ventas."; cont.appendChild(v); return; }

  const dias = {};
  data.forEach(v => {
    const k = fechaLocal(new Date(v.fecha_hora));
    dias[k] = dias[k] || { n: 0, t: 0 };
    dias[k].n++; dias[k].t += Number(v.total);
  });
  Object.keys(dias).sort().reverse().forEach(k => {
    const b = document.createElement("button"); b.type = "button"; b.className = "dia"; b.dataset.f = k;
    const [y, m, d] = partes(k);
    const f = document.createElement("span");
    f.textContent = new Date(y, m - 1, d).toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" });
    const n = document.createElement("span"); n.className = "n"; n.textContent = dias[k].n + (dias[k].n === 1 ? " venta" : " ventas");
    const t = document.createElement("span"); t.className = "m"; t.textContent = "$" + dinero(dias[k].t);
    b.append(f, n, t);
    b.onclick = () => { $("fechaVentas").value = k; cargarDia(); marcarDia(); };
    cont.appendChild(b);
  });
  marcarDia();
}
function marcarDia(){
  document.querySelectorAll(".dia").forEach(b => b.classList.toggle("sel", b.dataset.f === $("fechaVentas").value));
}

/* Sesión */
function mostrarApp(sesion){
  if (sesion) {
    $("login").style.display = "none";
    $("app").style.display = "block";
    cargarProductos(); actualizar(); mostrarVista("venta");
  } else {
    $("login").style.display = "block";
    $("app").style.display = "none";
  }
}

async function entrar(){
  $("errorLogin").textContent = "";
  const { error } = await db.auth.signInWithPassword({
    email: $("correo").value.trim(),
    password: $("clave").value
  });
  if (error) {
    console.error(error);
    $("errorLogin").textContent = /invalid login/i.test(error.message) ? "Correo o contraseña incorrectos." : error.message;
  }
}
$("entrar").onclick = entrar;
$("clave").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
$("salir").onclick = () => db.auth.signOut();

db.auth.onAuthStateChange((_evento, sesion) => mostrarApp(sesion));
db.auth.getSession().then(({ data }) => mostrarApp(data.session));
</script>
